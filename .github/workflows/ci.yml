name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kr
          POSTGRES_PASSWORD: kr
          POSTGRES_DB: kr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kr -d kr" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest -q
      - name: Migrations match models
        env:
          DATABASE_URL: postgresql+psycopg://kr:kr@localhost:5432/kr
        run: uv run alembic upgrade head && uv run alembic check
      - name: OpenAPI spec is up to date
        run: uv run python -m scripts.export_openapi && git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend's OpenAPI spec
        run: npm run gen:types && git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
