services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kr
      POSTGRES_PASSWORD: kr
      POSTGRES_DB: kr
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kr -d kr"]
      interval: 2s
      retries: 30

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: &env_file
      - path: .env
        required: false
    environment: &db_url
      DATABASE_URL: postgresql+psycopg://kr:kr@db:5432/kr
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }

  etl:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: *env_file
    environment: *db_url
    command: ["python", "-m", "app.etl", "bootstrap"]
    volumes: ["./seed:/repo/seed"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: *env_file
    environment: *db_url
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  scheduler:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: *env_file
    environment: *db_url
    command: ["supercronic", "/repo/docker/crontab"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ./frontend }
    environment:
      API_URL: http://api:8000
    ports: ["5173:5173"]
    # Live-reload source edits; node_modules stays the image's own.
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [api]

volumes:
  pgdata:
